# Restored from the log of run 1970 (the last successful Rust build, VoxelSandbox-rust-7).
# Every command and every action input below is copied from that log. Not visible in a log, so inferred:
# the trigger (`on:`), the secret names, step names/ids and the `if:` conditions.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: ubuntu-latest   # the log shows the ubuntu-26.04 image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools   # not the action's default ("tools platform-tools"), which fails: no package 'tools'

      - name: Cache NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/25.2.9519653
            /usr/local/lib/android/sdk/ndk/25.1.8937393
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: ndk-25.2.9519653-25.1.8937393-cmake-3.22.1

      - name: Install NDK and CMake
        run: |
          for NDK_VER in "25.2.9519653" "25.1.8937393"; do
            if [ ! -d "$ANDROID_SDK_ROOT/ndk/$NDK_VER" ]; then
              echo "Installing NDK $NDK_VER..."
              sdkmanager --install "ndk;$NDK_VER"
            else
              echo "NDK $NDK_VER already present"
            fi
          done
          if [ ! -d "$ANDROID_SDK_ROOT/cmake/3.22.1" ]; then
            echo "Installing CMake 3.22.1..."
            sdkmanager --install "cmake;3.22.1"
          else
            echo "CMake 3.22.1 already present"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Find and extract the ZIP
        run: |
          ZIP=$(find . -maxdepth 3 -path './.git' -prune -o -type f -name "*.zip" -printf "%T@ %p\n" | sort -rn | head -1 | cut -d" " -f2-)
          if [ -z "$ZIP" ]; then
            echo "##[error]No ZIP file found in repository!"
            exit 1
          fi
          ZIP_NAME=$(basename "$ZIP" .zip)
          echo "zip_name=$ZIP_NAME" >> $GITHUB_ENV
          echo "zip_path=$ZIP" >> $GITHUB_ENV
          echo "Found zip: $ZIP"
          # -DD = ignore the timestamps stored in the ZIP; extracted files get the extraction time.
          # ZIPs stamped ahead of the runner's clock make Ninja fail with
          # "build.ninja still dirty after 100 tries".
          unzip -q -DD "$ZIP" -d extracted

      - name: Find project directory
        id: project
        run: |
          RESULT=$(find extracted -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | awk '{ print length($0) " " $0 }' | sort -n | head -1 | cut -d" " -f2-)
          if [ -z "$RESULT" ]; then
            echo "##[error]No settings.gradle found inside the zip!"
            find extracted | sort
            exit 1
          fi
          PROJECT_DIR=$(dirname "$RESULT")
          echo "Found project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Detect a Rust crate
        id: rust
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          CARGO_TOML=$(find "$PROJECT_DIR" -maxdepth 2 -name Cargo.toml -not -path '*/target/*' | awk '{ print length($0) " " $0 }' | sort -n | head -1 | cut -d" " -f2-)
          if [ -n "$CARGO_TOML" ]; then
            echo "has_rust=true" >> $GITHUB_OUTPUT
            echo "cargo_dir=$(dirname "$CARGO_TOML")" >> $GITHUB_OUTPUT
            echo "Rust crate found at: $(dirname "$CARGO_TOML")"
          else
            echo "has_rust=false" >> $GITHUB_OUTPUT
            echo "No Cargo.toml - plain Gradle project"
          fi

      - name: Pick the Rust targets (from rustAbis in gradle.properties)
        id: abis
        if: steps.rust.outputs.has_rust == 'true'
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          ABIS=$(grep -E '^rustAbis=' "$PROJECT_DIR/gradle.properties" 2>/dev/null | head -1 | cut -d= -f2 | tr -d '\r' | tr ',' ' ')
          if [ -z "$ABIS" ]; then ABIS="arm64-v8a"; fi
          TARGETS=""
          for A in $ABIS; do
            case "$A" in
              arm64-v8a)   TARGETS="$TARGETS aarch64-linux-android" ;;
              armeabi-v7a) TARGETS="$TARGETS armv7-linux-androideabi" ;;
              x86_64)      TARGETS="$TARGETS x86_64-linux-android" ;;
              x86)         TARGETS="$TARGETS i686-linux-android" ;;
              *) echo "##[warning]Unknown ABI '$A' in rustAbis - ignored" ;;
            esac
          done
          echo "abis=$ABIS" >> $GITHUB_OUTPUT
          echo "targets=$TARGETS" >> $GITHUB_OUTPUT
          echo "ABIs: $ABIS"
          echo "Rust targets: $TARGETS"

      - name: Install Rust
        if: steps.rust.outputs.has_rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Add the Rust Android targets
        if: steps.rust.outputs.has_rust == 'true'
        run: |
          rustup target add ${{ steps.abis.outputs.targets }}
          rustc --version
          cargo --version

      - name: Cache Rust builds
        if: steps.rust.outputs.has_rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.rust.outputs.cargo_dir }}
          cache-on-failure: true

      - name: Cache cargo-ndk
        id: cargo_ndk
        if: steps.rust.outputs.has_rust == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2-${{ runner.os }}

      - name: Install cargo-ndk
        if: steps.rust.outputs.has_rust == 'true' && steps.cargo_ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Find an NDK for Rust
        if: steps.rust.outputs.has_rust == 'true'
        run: |
          NDK=""
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK="$ANDROID_NDK_LATEST_HOME"
          fi
          if [ -z "$NDK" ]; then
            echo "Installing NDK 27.2.12479018..."
            sdkmanager --install "ndk;27.2.12479018"
            NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          fi
          echo "NDK for Rust: $NDK"
          echo "RUST_NDK_HOME=$NDK" >> $GITHUB_ENV

      - name: Rust unit tests
        if: steps.rust.outputs.has_rust == 'true'
        working-directory: ${{ steps.rust.outputs.cargo_dir }}
        run: |
          set -o pipefail
          cargo test --lib 2>&1 | tee rust-test.log
          echo "---- test summary ----"
          grep -E "^test result|FAILED|panicked" rust-test.log || true

      - name: Build the Rust library (cargo-ndk)
        if: steps.rust.outputs.has_rust == 'true'
        working-directory: ${{ steps.rust.outputs.cargo_dir }}
        run: |
          set -o pipefail
          JNI_DIR="$GITHUB_WORKSPACE/${{ steps.project.outputs.project_dir }}/app/src/main/jniLibs"
          mkdir -p "$JNI_DIR"
          ARGS=""
          for A in ${{ steps.abis.outputs.abis }}; do ARGS="$ARGS -t $A"; done
          cargo ndk --version
          cargo ndk $ARGS -o "$JNI_DIR" build --release 2>&1 | tee rust-build.log
          echo "---- built libraries ----"
          find "$JNI_DIR" -name '*.so' -exec ls -la {} \;
          # Generic check (any Rust project, any library name): every requested ABI must have a .so file.
          for A in ${{ steps.abis.outputs.abis }}; do
            if ! find "$JNI_DIR/$A" -maxdepth 1 -name '*.so' 2>/dev/null | grep -q .; then
              echo "##[error]cargo-ndk produced no .so file for ABI $A"
              exit 1
            fi
          done

      - name: Cache CMake / C++ build outputs
        uses: actions/cache@v4
        with:
          path: ${{ steps.project.outputs.project_dir }}/app/.cxx
          key: cxx-debug-${{ hashFiles('extracted/**/CMakeLists.txt') }}
          restore-keys: cxx-debug-

      - name: Fetch gradle-wrapper.jar
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          GRADLE_VERSION="8.6"
          JAR="gradle/wrapper/gradle-wrapper.jar"
          mkdir -p gradle/wrapper
          echo "Downloading gradle-wrapper.jar for Gradle ${GRADLE_VERSION}..."
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}.0/gradle/wrapper/gradle-wrapper.jar" \
            -o "$JAR"
          SIZE=$(stat -c%s "$JAR")
          if [ "$SIZE" -lt 10000 ]; then
            echo "ERROR: gradle-wrapper.jar suspiciously small (${SIZE} bytes) — aborting"
            exit 1
          fi
          echo "Jar OK: ${SIZE} bytes"

      - name: Make gradlew executable
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: chmod +x gradlew && sed -i 's/\r//' gradlew

      - name: Decode keystore (if available)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > $RUNNER_TEMP/release.jks
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
            echo "Keystore decoded ✓"
          else
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
            echo "No KEYSTORE_BASE64 secret — building debug APK"
          fi

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # A Rust project's library was already built above; tell Gradle not to build it again.
          EXTRA=""
          if [ "${{ steps.rust.outputs.has_rust }}" = "true" ]; then
            EXTRA="-PrustPrebuilt=true"
          fi
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --configuration-cache --build-cache --parallel $EXTRA \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            ./gradlew assembleDebug --no-daemon --configuration-cache --build-cache --parallel $EXTRA
          fi

      - name: Find the APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            TYPE=release
          else
            TYPE=debug
          fi
          APK_PATH=$(find app/build/outputs/apk/$TYPE -name "*.apk" | head -1)
          echo "APK type: $TYPE"
          if [ -z "$APK_PATH" ]; then
            echo "##[error]Build finished but no APK was found!"
            exit 1
          fi
          echo "APK: $APK_PATH ($(stat -c%s "$APK_PATH") bytes)"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_type=$TYPE" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.zip_name }}-${{ steps.apk.outputs.apk_type }}-v${{ github.run_number }}
          path: ${{ steps.project.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.zip_name }}-mapping-v${{ github.run_number }}
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/mapping/${{ steps.apk.outputs.apk_type }}/mapping.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Clean up - delete zip after the build
        if: always()
        run: |
          ZIP="${{ env.zip_path }}"
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "No ZIP to delete"
            exit 0
          fi
          STATUS="${{ job.status }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch "$ZIP"
          if git diff --cached --quiet; then
            echo "ZIP was not tracked by git; nothing to commit"
            exit 0
          fi
          git commit -m "ci: remove $ZIP after build #${{ github.run_number }} ($STATUS) [skip ci]"
          git push || { git pull --rebase && git push; }
